name: dashboard
on:
  schedule:
    - cron: "30 13 * 1-6,10-12 *"   # daily, 5:30 AM PST / 6:30 AM PDT; never July-September
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: gate
        run: python -m skireport gate
      - if: steps.gate.outputs.go == 'true'
        id: pages
        uses: actions/configure-pages@v5
      # No BASE_LOCATION here: the site is public.
      - if: steps.gate.outputs.go == 'true'
        run: python -m skireport dashboard --out site/data/latest.json
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - if: steps.gate.outputs.go == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
