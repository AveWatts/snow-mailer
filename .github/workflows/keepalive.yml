name: keepalive
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # GitHub disables scheduled workflows in public repos after 60 days without activity.
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            git config user.name "ski-report-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
